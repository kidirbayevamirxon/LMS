services:
  postgres:
    image: postgres:17-alpine
    container_name: edumanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edumanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edumanager_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-edumanager_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - edumanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edumanager} -d ${POSTGRES_DB:-edumanager_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edumanager-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edumanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-edumanager}:${POSTGRES_PASSWORD:-edumanager_secret_2026}@postgres:5432/${POSTGRES_DB:-edumanager_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-edumanager_super_secret_access_key_prod_2026_uz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-edumanager_super_secret_refresh_key_prod_2026_uz}
      FACE_ENCRYPTION_KEY: ${FACE_ENCRYPTION_KEY:-9b8a7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8088/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - edumanager_uploads:/app/uploads

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: edumanager-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: edumanager-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - edumanager_uploads:/var/www/uploads:ro

volumes:
  edumanager_pgdata:
  edumanager_uploads:
